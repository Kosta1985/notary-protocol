<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AccordTrace Control Plane</title><link rel="icon" href="/favicon.svg"><style>body{font-family:system-ui,sans-serif;margin:0;background:#0d1117;color:#e6edf3}main{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px}.metric{font-size:30px;font-weight:700}.muted{color:#8b949e}input,button,select{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:10px}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.incident{padding:12px 0;border-bottom:1px solid #21262d}.high{color:#ff7b72}.medium{color:#d29922}.low{color:#3fb950}code{font-size:12px}.hidden{display:none}</style><link rel="stylesheet" href="/site-resilience.css"></head><body class="console-page"><a class="skip-link" href="#main-content">Skip to main content</a><main id="main-content"><header><div><h1>AccordTrace Control Plane</h1><div class="muted">Enterprise incident console · no secrets displayed</div></div><div class="row"><input aria-label="Operator token" id="token" type="password" autocomplete="off" placeholder="Operator token"><button id="connect">Connect</button><button id="clear">Clear token</button></div></header><section id="app" class="hidden"><h2>Security summary</h2><div id="summary" class="grid"></div><h2>Incidents</h2><div class="row"><select aria-label="Incident type" id="type"><option value="">All types</option><option>security_event</option><option>canary_touch</option><option>gateway_denial</option><option>lease_revocation</option><option>attestor_state</option><option>payment_anomaly</option></select><input aria-label="Filter by Agent Passport ID" id="passport" placeholder="Passport ID"><button id="refresh">Refresh</button></div><div id="incidents" class="card" style="margin-top:12px"></div></section><p id="status" class="muted" aria-live="polite"></p></main><script src="/console.js" type="module"></script></body></html>
