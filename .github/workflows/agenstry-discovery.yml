name: Accord Trace Agenstry discovery

on:
  workflow_run:
    workflows: ["Deploy AccordTrace production"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: read

concurrency:
  group: accordtrace-agenstry-discovery
  cancel-in-progress: true

jobs:
  validate-and-check-discovery:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Upsert deployed Accord Trace through Agenstry public validator
        shell: bash
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":"accordtrace-index","method":"SendMessage","params":{"message":{"messageId":"accordtrace-index","role":"ROLE_USER","parts":[{"text":"validate: https://accordtrace.notary-labs.workers.dev"}]}}}'
          response="$(curl --fail-with-body --silent --show-error \
            --request POST 'https://agenstry.com/a2a' \
            --header 'content-type: application/json' \
            --header 'A2A-Version: 1.0' \
            --data "$payload")"
          printf '%s\n' "$response" | jq .
          if printf '%s' "$response" | jq -e '.error' >/dev/null; then
            echo 'Agenstry returned a JSON-RPC error.' >&2
            exit 1
          fi

          # Agenstry returns the validator document as JSON text inside an A2A part.
          # Decode that text before asserting the indexed Agent Card contract.
          validation="$(printf '%s' "$response" | jq -cer '
            [
              .result.message.parts[]?.text?
              | select(type == "string")
              | try fromjson catch empty
              | select(
                  (.raw_json?.name? == "Accord Trace")
                  or (.card?.name? == "Accord Trace")
                  or (.name? == "Accord Trace")
                )
            ][0] // empty
          ')"
          if [[ -z "$validation" ]]; then
            echo 'Agenstry validation response did not contain the deployed Accord Trace card.' >&2
            exit 1
          fi
          if ! printf '%s' "$validation" | jq -e '
            (.ok == true)
            and (.live_responds == true)
            and (.card_format == "current")
          ' >/dev/null; then
            echo 'Agenstry did not confirm a live current-format Accord Trace card.' >&2
            exit 1
          fi

          for skill in \
            notarize_evidence \
            verify_proof \
            get_proof \
            hash_content \
            network_capabilities \
            network_stats \
            passport_product_capabilities \
            wallet_capabilities \
            resolve_referral
          do
            if ! printf '%s' "$validation" | jq -e --arg skill "$skill" \
              '[(.raw_json.skills // .card.skills // [])[].id] | index($skill) != null' >/dev/null; then
              echo "Agenstry indexed card is missing required skill: $skill" >&2
              exit 1
            fi
          done

      - name: Check semantic discovery queries
        shell: bash
        run: |
          set -euo pipefail
          for query in \
            'cryptographic proof verification for AI agents' \
            'tamper evident agent handoff receipt' \
            'verify AI agent artifact integrity' \
            'AI agent affiliate referral network' \
            'agent passport certificate readiness' \
            'AI agent USDC wallet treasury policy no credit'
          do
            echo "=== $query ==="
            curl --fail-with-body --silent --show-error --get \
              'https://agenstry.com/api/v1/skills/find_agent' \
              --data-urlencode "query=$query" | jq .
          done

      - name: Discovery note
        run: |
          echo 'Agenstry validation mutates/upserts its public index by design.'
          echo 'Post-deploy triggering prevents indexing a stale pre-deployment Agent Card.'
          echo 'This workflow does not send unsolicited messages.'