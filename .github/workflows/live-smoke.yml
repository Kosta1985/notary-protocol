name: AccordTrace production smoke

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "adapters/**"
      - "web/.well-known/**"
      - "docs/openapi.json"
      - "scripts/live-smoke.js"
      - ".github/workflows/live-smoke.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accordtrace-production-smoke
  cancel-in-progress: true

jobs:
  verify-public-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke-test AccordTrace production
        env:
          ACCORDTRACE_BASE: https://accordtrace.notary-labs.workers.dev
        run: node scripts/live-smoke.js
