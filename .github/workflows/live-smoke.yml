name: AccordTrace production smoke

on:
  workflow_run:
    workflows: ["Deploy AccordTrace production"]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accordtrace-production-smoke
  cancel-in-progress: true

jobs:
  verify-public-service:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Black-box test AccordTrace production
        run: node --import ./scripts/monitor-fetch.mjs scripts/live-agent-check.mjs https://accordtrace.notary-labs.workers.dev
