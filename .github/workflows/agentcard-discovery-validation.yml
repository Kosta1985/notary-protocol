name: One-time corrected AgentCard receipt attestation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agentcard-discovery-validation.yml"

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Attest corrected receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -n --slurpfile receipt partners/receipts/agentcard-20260826-01.json             '{data:$receipt[0],metadata:{source:"accordtrace-founding-agent-program",record_type:"external_agent_validation_receipt"}}'             > receipt-proof-request.json
          curl --silent --show-error --fail-with-body -X POST             https://accordtrace.notary-labs.workers.dev/api/v1/proofs             -H "content-type: application/json"             --data-binary @receipt-proof-request.json > receipt-proof-response.json
          jq -e '.proof_id != null' receipt-proof-response.json >/dev/null

      - name: Summarize
        run: |
          {
            echo "## Corrected AgentCard receipt attestation"
            echo "- Proof ID: $(jq -r '.proof_id' receipt-proof-response.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve proof
        uses: actions/upload-artifact@v4
        with:
          name: agentcard-corrected-receipt-proof
          path: |
            receipt-proof-request.json
            receipt-proof-response.json
          retention-days: 30
