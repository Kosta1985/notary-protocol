name: AccordTrace external agent smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "19 2 * * *"

permissions:
  contents: read

concurrency:
  group: accord-trace-agent-smoke
  cancel-in-progress: true

jobs:
  black-box-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Discover, notarize, verify, and call A2A/MCP
        run: node scripts/live-agent-check.mjs https://accordtrace.notary-labs.workers.dev
