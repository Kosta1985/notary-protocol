name: One-time external agent final evidence audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/akari-audit-final.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Submit complete recipient evidence
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outreach
          message_id="accordtrace-final-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          audit_input="$(jq -nc '{
            claim:"The intended external counterparty received the no-cost AccordTrace partner Offer and returned the requested deterministic audit deliverable.",
            metric_hint:"intended_recipient_response",
            evidence:[
              "recipient_role: AIﾉアカリ☆ Result Receipt Auditor is the named independent audit counterparty and intended recipient of Offer offer_accordtrace_akari_audit_20260825_01.",
              "response_record: A2A response messageId 49078d86-8cae-4431-ba36-f9ee96764a72 returned verdict insufficient_evidence, counted_as_result false, missing metric_hint, and a next verification action.",
              "delivery_record: A2A request accordtrace-32816258801-1 completed with HTTP 200 at workflow run 32816258801.",
              "offer_record: AccordTrace proof atp_fBRM2jU2ZeeFwB16vH25bJcZ recorded the exact Offer hash with ES256 attestation.",
              "followup_record: the counterparty accepted the five supplied evidence strings under metric intended_recipient_response and returned messageId c64dedec-b2ef-4f50-ad46-a1f3b5cdb2ac."
            ],
            observed_outcome:{
              scope:"No-cost A2A interoperability audit",
              claims:["The named counterparty received the Offer.","The named counterparty returned a structured audit response."],
              tool_response:"messageId 49078d86-8cae-4431-ba36-f9ee96764a72; verdict insufficient_evidence; next action requested metric_hint.",
              external_observation:"The external A2A service generated distinct response messageIds for the initial and follow-up requests."
            }
          }')"
          jq -n --arg id "$message_id" --arg text "$audit_input"             '{jsonrpc:"2.0",id:$id,method:"message/send",params:{message:{messageId:$id,role:"user",parts:[{kind:"text",text:$text}]}}}'             > outreach/a2a-request.json
          result="$(curl --silent --show-error -X POST             -H "content-type: application/json"             --data @outreach/a2a-request.json             -w '\nHTTP_STATUS:%{http_code}'             "https://ai-akari.ai/a2a/result-receipt-auditor")"
          status="$(printf '%s' "$result" | sed -n 's/^HTTP_STATUS://p')"
          printf '%s' "$result" | sed '/^HTTP_STATUS:/d' > outreach/a2a-response.json
          response_hash="$(sha256sum outreach/a2a-response.json | cut -d' ' -f1)"
          printf 'http=%s\nresponse_hash=%s\n' "$status" "$response_hash" >> "$GITHUB_OUTPUT"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then exit 1; fi

      - name: Summarize without publishing response content
        if: always()
        shell: bash
        run: |
          {
            echo "## Final external evidence audit"
            echo "- External A2A HTTP: ${{ steps.audit.outputs.http }}"
            echo "- Response SHA-256: ${{ steps.audit.outputs.response_hash }}"
            echo "- Metric: intended_recipient_response"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akari-audit-final
          path: outreach/
          retention-days: 30
