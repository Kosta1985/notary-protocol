name: Initialize missing AccordTrace issuer

on:
  push:
    branches: [ops/initialize-missing-issuer-20260905]
    paths: [.github/workflows/initialize-missing-issuer.yml]

permissions:
  contents: read

concurrency:
  group: accordtrace-production
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Initialize only the absent issuer; never replace an existing binding
        env:
          CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          CF_TOKEN_4: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          mkdir -p .audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {generateKeyPairSync,createHash,sign,verify} from 'node:crypto';
          const base='https://accordtrace.notary-labs.workers.dev';
          const expectedRelease='b11a135dd27bfdfce549039da0b11579471f0400';
          const report={checked_at:new Date().toISOString(),action:'initialize_absent_issuer_only',secret_created:false,existing_secrets_replaced:false,private_key_exported_to_artifacts:false,checkout_enabled_for_sales:false};
          async function publicGet(path){
            const response=await fetch(base+path,{headers:{'x-notary-monitor':'issuer-initialization','x-accordtrace-telemetry':'exclude'},redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw new Error(`Public readiness HTTP ${response.status}`);
            return response.json();
          }
          const token=[1,2,3,4].map(n=>process.env[`CF_TOKEN_${n}`]).find(Boolean);
          if(!token)throw new Error('Cloudflare token unavailable');
          const api='https://api.cloudflare.com/client/v4';
          async function cf(path,method='GET',body){
            const response=await fetch(api+path,{method,headers:{authorization:`Bearer ${token}`,...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),redirect:'error',signal:AbortSignal.timeout(15000)});
            let result;try{result=await response.json()}catch{throw new Error('Cloudflare response invalid')}
            if(!response.ok||!result.success)throw new Error(`Cloudflare operation HTTP ${response.status}`);
            return result.result;
          }
          try{
            const release=await publicGet('/api/v1/launch/capabilities');
            if(release.release_sha!==expectedRelease)throw new Error('Production release changed; stop for review');
            report.release_sha=release.release_sha;
            const before=await publicGet('/api/v1/passport-product/capabilities');
            if(before.checkout_activation_enabled!==false||before.commercial_ready!==false)throw new Error('Checkout must remain held closed');
            report.before={certificate_signing_enabled:before.certificate_signing_enabled,certificate_signer:before.certificate_signer};
            let account=[1,2,3,4].map(n=>process.env[`CF_ACCOUNT_${n}`]).find(Boolean);
            if(!account){const accounts=await cf('/accounts');if(accounts.length!==1)throw new Error('Cloudflare account ambiguous');account=accounts[0].id;}
            if(!/^[a-f0-9]{32}$/.test(account))throw new Error('Account identifier invalid');
            const settingsPath=`/accounts/${account}/workers/scripts/accordtrace/settings`;
            const settings=await cf(settingsPath);
            if((settings.bindings||[]).some(b=>b.name==='NOTARY_PRIVATE_JWK'))throw new Error('Issuer binding already exists; never overwrite');
            const db=settings.bindings.find(b=>b.name==='DB'&&b.type==='d1');
            const dbId=db?.id||db?.database_id;
            if(!dbId||!/^[a-f0-9-]{36}$/.test(dbId))throw new Error('Production DB unresolved');
            async function count(sql){
              const rows=await cf(`/accounts/${account}/d1/database/${dbId}/query`,'POST',{sql});
              if(rows.length!==1||rows[0].success!==true||!Number.isSafeInteger(rows[0].results?.[0]?.count))throw new Error('History guard could not be verified');
              return rows[0].results[0].count;
            }
            report.history={
              certificates:await count('SELECT COUNT(*) AS count FROM agent_passport_certificates'),
              orders:await count('SELECT COUNT(*) AS count FROM passport_product_orders'),
              signed_or_unparseable_receipts:await count("SELECT COUNT(*) AS count FROM receipts WHERE CASE WHEN json_valid(receipt) THEN (json_type(receipt,'$.notary.signature') IS NOT NULL OR json_type(receipt,'$.issuer.signature') IS NOT NULL) ELSE 1 END")
            };
            if(Object.values(report.history).some(n=>n!==0))throw new Error('Prior signing or commercial history exists; recovery review required');
            const current=await cf(settingsPath);
            if(current.bindings.some(b=>b.name==='NOTARY_PRIVATE_JWK'))throw new Error('Issuer was configured concurrently; never overwrite');
            const hold=current.bindings.find(b=>b.name==='PASSPORT_CHECKOUT_ENABLED');
            if(hold?.type!=='plain_text'||String(hold.text)!=='false')throw new Error('Activation hold missing from current configuration');
            const {privateKey,publicKey}=generateKeyPairSync('ed25519');
            const probe=Buffer.from('accordtrace.issuer-bootstrap.v1');
            if(!verify(null,probe,publicKey,sign(null,probe,privateKey)))throw new Error('Generated issuer failed self-test');
            const privateJwk=JSON.stringify(privateKey.export({format:'jwk'}));
            const fingerprint='sha256:'+createHash('sha256').update(publicKey.export({format:'der',type:'spki'})).digest('hex');
            // The private key is transmitted only to the authorized Cloudflare
            // secret endpoint. It is never printed, saved to disk or archived.
            await cf(`/accounts/${account}/workers/scripts/accordtrace/secrets`,'PUT',{name:'NOTARY_PRIVATE_JWK',type:'secret_text',text:privateJwk});
            report.secret_created=true;
            report.public_key_fingerprint=fingerprint;
            let after;
            for(let attempt=0;attempt<12;attempt++){
              after=await publicGet('/api/v1/passport-product/capabilities');
              if(after.certificate_signer?.public_key_fingerprint===fingerprint)break;
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            report.after={certificate_signing_enabled:after.certificate_signing_enabled,certificate_signer:after.certificate_signer,checkout_activation_enabled:after.checkout_activation_enabled,commercial_ready:after.commercial_ready};
            if(after.certificate_signer?.public_key_fingerprint!==fingerprint||after.certificate_signer?.valid!==true||after.certificate_signing_enabled!==true)throw new Error('Production signer not yet verified; do not activate checkout');
            if(after.checkout_activation_enabled!==false||after.commercial_ready!==false)throw new Error('Production checkout hold was not preserved');
            report.status='initialized_and_verified_checkout_held';
          }catch(error){report.status='blocked';report.error=error.message;process.exitCode=1;}
          finally{fs.writeFileSync('.audit/issuer-initialization.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));}
          NODE
      - name: Read-only website verification after initialization
        run: node scripts/audit/website-system.mjs
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/accordtrace-browser" --no-package-lock --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/accordtrace-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/accordtrace-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Read-only desktop and mobile browser verification
        run: node scripts/audit/website-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issuer-initialization-${{ github.sha }}
          path: .audit/
          include-hidden-files: true
          retention-days: 7
