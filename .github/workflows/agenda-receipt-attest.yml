name: Manual corrected Agenda receipt attestation

on:
  workflow_dispatch:
    inputs:
      confirm_attest:
        description: 'Type ATTEST to create the synthetic corrected receipt proof'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: accordtrace-agenda-receipt-attest
  cancel-in-progress: false

jobs:
  attest:
    if: ${{ inputs.confirm_attest == 'ATTEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Attest corrected receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agenda-attestation
          jq -c '{
            data: .,
            metadata: {
              synthetic: true,
              client: "accordtrace-agenda-pilot",
              evidence_type: "external_a2a_receipt",
              partnership_acceptance: false,
              corrected_receipt: true
            }
          }' partners/receipts/agenda-20260826-01.json > agenda-attestation/request.json
          status="$(curl --silent --show-error \
            --output agenda-attestation/proof.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data-binary @agenda-attestation/request.json \
            'https://accordtrace.notary-labs.workers.dev/api/v1/proofs')"
          test "$status" = "201"
          jq -e '.proof_id | startswith("atp_")' agenda-attestation/proof.json >/dev/null
          jq . agenda-attestation/proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-corrected-receipt-proof
          path: agenda-attestation/proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Safety note
        run: |
          echo 'This workflow has no push or schedule trigger.'
          echo 'Creating the synthetic proof requires workflow_dispatch plus the exact ATTEST confirmation.'
