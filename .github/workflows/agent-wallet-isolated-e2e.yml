name: Agent Wallet isolated sandbox e2e

on:
  push:
    branches: [test/agent-wallet-isolated-e2e-20260905]
    paths:
      - scripts/agent-wallet-isolated-e2e.mjs
      - .github/workflows/agent-wallet-isolated-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-wallet-isolated-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN_3: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_4: ${{ secrets.CF_TOKEN }}
      CF_ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate source before external sandbox
        run: |
          npm test
          npm run production:check
          npm run cf:prepare

      - name: Resolve Cloudflare credentials
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          token=""
          for candidate in "${CF_TOKEN_1:-}" "${CF_TOKEN_2:-}" "${CF_TOKEN_3:-}" "${CF_TOKEN_4:-}"; do
            if [[ -n "$candidate" ]]; then token="$candidate"; break; fi
          done
          if [[ -z "$token" ]]; then echo 'Cloudflare token is required for isolated e2e.' >&2; exit 2; fi
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          account=""
          for candidate in "${CF_ACCOUNT_1:-}" "${CF_ACCOUNT_2:-}" "${CF_ACCOUNT_3:-}" "${CF_ACCOUNT_4:-}"; do
            if [[ -n "$candidate" ]]; then account="$candidate"; break; fi
          done
          if [[ -z "$account" ]]; then
            account="$(curl --fail --silent --show-error -H "Authorization: Bearer $token" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')"
          fi
          [[ "$account" =~ ^[a-f0-9]{32}$ ]] || { echo 'Cloudflare account could not be resolved.' >&2; exit 3; }
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Create isolated Worker and D1 identities
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          worker="at-wallet-e2e-${GITHUB_RUN_ID}"
          db_name="${worker}"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' \
            --data "$(jq -nc --arg name "$db_name" '{name:$name}')" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          db_id="$(printf '%s' "$response" | jq -r '.result.uuid // empty')"
          [[ "$db_id" =~ ^[a-f0-9-]{36}$ ]] || { echo 'Isolated D1 database was not created.' >&2; exit 4; }
          subdomain="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty' || true)"
          if [[ -z "$subdomain" ]]; then subdomain='notary-labs'; fi
          echo "E2E_WORKER=$worker" >> "$GITHUB_ENV"
          echo "E2E_DB_ID=$db_id" >> "$GITHUB_ENV"
          echo "E2E_BASE_URL=https://${worker}.${subdomain}.workers.dev" >> "$GITHUB_ENV"
          mkdir -p .audit
          jq -nc --arg worker "$worker" --arg database "$db_name" '{sandbox_created:true,worker:$worker,database:$database,real_funds:false,credit_or_lending:false}' > .audit/wallet-sandbox-resources.json

      - name: Build isolated fail-closed config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.name=process.env.E2E_WORKER;
          config.workers_dev=true;
          config.preview_urls=false;
          delete config.triggers;
          config.d1_databases[0].database_id=process.env.E2E_DB_ID;
          config.vars={
            PUBLIC_BASE_URL:process.env.E2E_BASE_URL,
            WALLET_MODE:'testnet',
            WALLET_PROVIDER:'accord_test',
            WALLET_NETWORK:'accord:isolated-testnet',
            WALLET_CHAIN_ID:'0',
            TEST_WALLET_INITIAL_USDC_ATOMIC:'100000000',
            FEATURE_AGENT_WALLETS:'true',
            FEATURE_AGENT_PAYMENTS:'true',
            FEATURE_AGENT_TREASURY:'true',
            FEATURE_ECONOMIC_TRUST:'true',
            FEATURE_GUARDIAN_CONTROLS:'true',
            PASSPORT_CHECKOUT_ENABLED:'false'
          };
          config.observability={enabled:false};
          fs.writeFileSync('wrangler.wallet-e2e.json',JSON.stringify(config,null,2));
          NODE
          if grep -Eq 'STRIPE_SECRET|STRIPE_WEBHOOK|NOTARY_PRIVATE|sk_live|rk_live|loan|credit_line|overdraft' wrangler.wallet-e2e.json; then
            echo 'Sandbox config contains a forbidden production/credit marker.' >&2
            exit 5
          fi

      - name: Apply schema to isolated D1
        run: npx wrangler@latest d1 migrations apply DB --remote --config wrangler.wallet-e2e.json

      - name: Generate ephemeral Agent Passport keys and seed public keys
        shell: bash
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/agent-wallet-e2e-keys.json"
          seed="$RUNNER_TEMP/agent-wallet-e2e-seed.sql"
          node scripts/agent-wallet-isolated-e2e.mjs prepare "$keys" "$seed"
          echo "E2E_KEYS_FILE=$keys" >> "$GITHUB_ENV"
          echo "E2E_SEED_FILE=$seed" >> "$GITHUB_ENV"
          npx wrangler@latest d1 execute DB --remote --config wrangler.wallet-e2e.json --file "$seed"

      - name: Deploy isolated Worker
        run: npx wrangler@latest deploy --config wrangler.wallet-e2e.json

      - name: Install ephemeral Guardian operator secret
        shell: bash
        run: |
          set -euo pipefail
          token="$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$token"
          echo "WALLET_E2E_OPERATOR_TOKEN=$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | npx wrangler@latest secret put WALLET_OPERATOR_TOKEN --config wrangler.wallet-e2e.json >/dev/null

      - name: Wait for isolated machine contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$E2E_BASE_URL/api/v1/agent/wallet-capabilities" | jq -e '.wallet_enabled == true and .payments_enabled == true and .payment_contract.funded_balance_only == true and .credit_and_lending.enabled == false' >/dev/null; then
              echo "Isolated Agent Wallet ready after attempt $attempt."
              exit 0
            fi
            sleep 3
          done
          echo 'Isolated Agent Wallet did not become ready.' >&2
          exit 6

      - name: Run real HTTP Alpha to Beta signed-agent flow
        shell: bash
        run: |
          set -euo pipefail
          node scripts/agent-wallet-isolated-e2e.mjs run "$E2E_BASE_URL" "$E2E_KEYS_FILE" | tee .audit/wallet-sandbox-e2e.json

      - name: Delete isolated Cloudflare resources
        if: always()
        shell: bash
        run: |
          set +e
          api='https://api.cloudflare.com/client/v4'
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${E2E_WORKER:-}" ]]; then
            curl --silent --show-error -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$E2E_WORKER" >/tmp/worker-delete.json
          fi
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${E2E_DB_ID:-}" ]]; then
            curl --silent --show-error -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$E2E_DB_ID" >/tmp/db-delete.json
          fi
          rm -f "${E2E_KEYS_FILE:-}" "${E2E_SEED_FILE:-}" wrangler.wallet-e2e.json /tmp/worker-delete.json /tmp/db-delete.json

      - name: Archive sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-wallet-isolated-e2e-${{ github.run_id }}
          path: .audit/
          include-hidden-files: true
          retention-days: 7
