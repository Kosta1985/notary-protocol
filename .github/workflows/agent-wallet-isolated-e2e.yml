name: Agent Wallet isolated sandbox e2e

on:
  workflow_dispatch:
  push:
    branches: [hardening/wallet-e2e-clean-20260906]
    paths: [.github/wallet-e2e-trigger]

permissions:
  contents: read

concurrency:
  group: agent-wallet-isolated-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate source before external sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit
          git archive --format=zip --output=.audit/wallet-source.zip HEAD
          npm test | tee .audit/unit-tests.log
          npm run production:check | tee .audit/source-readiness.log
          npm run cf:prepare

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          CF_TOKEN_4: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=""
          for candidate in "${CF_TOKEN_1:-}" "${CF_TOKEN_2:-}" "${CF_TOKEN_3:-}" "${CF_TOKEN_4:-}"; do
            if [[ -n "$candidate" ]]; then token="$candidate"; break; fi
          done
          [[ -n "$token" ]] || { echo 'Cloudflare token is required.' >&2; exit 2; }
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          account=""
          for candidate in "${CF_ACCOUNT_1:-}" "${CF_ACCOUNT_2:-}" "${CF_ACCOUNT_3:-}" "${CF_ACCOUNT_4:-}"; do
            if [[ -n "$candidate" ]]; then account="$candidate"; break; fi
          done
          if [[ -z "$account" ]]; then
            account="$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $token" https://api.cloudflare.com/client/v4/accounts | jq -r 'if (.result | length) == 1 then .result[0].id else empty end')"
          fi
          [[ "$account" =~ ^[a-f0-9]{32}$ ]] || { echo 'An unambiguous Cloudflare account is required.' >&2; exit 3; }
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Create isolated Worker and D1 identities
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          worker="at-wallet-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "E2E_WORKER=$worker" >> "$GITHUB_ENV"
          response="$(curl --fail-with-body --silent --show-error --max-time 20 -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data "$(jq -nc --arg name "$worker" '{name:$name}')" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          db_id="$(printf '%s' "$response" | jq -r '.result.uuid // empty')"
          [[ "$db_id" =~ ^[a-f0-9-]{36}$ ]] || { echo 'Isolated D1 was not created.' >&2; exit 4; }
          echo "E2E_DB_ID=$db_id" >> "$GITHUB_ENV"
          subdomain="$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')"
          [[ "$subdomain" =~ ^[a-z0-9-]+$ ]] || { echo 'Worker subdomain unavailable.' >&2; exit 5; }
          echo "E2E_BASE_URL=https://${worker}.${subdomain}.workers.dev" >> "$GITHUB_ENV"
          jq -nc --arg worker "$worker" '{sandbox_created:true,worker:$worker,real_funds:false,credit_or_lending:false}' > .audit/wallet-sandbox-resources.json

      - name: Build isolated fail-closed config
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { isolatedBaseUrl } from './scripts/lib/wallet-e2e-http.mjs';
          const source = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const base = isolatedBaseUrl(process.env.E2E_BASE_URL);
          if (source.main !== 'cloudflare/src/worker-v2.js') throw new Error('Unexpected runtime entrypoint');
          const config = {
            name: process.env.E2E_WORKER,
            main: source.main,
            compatibility_date: source.compatibility_date,
            workers_dev: true,
            preview_urls: false,
            assets: source.assets,
            d1_databases: [{ binding: 'DB', database_name: process.env.E2E_WORKER, database_id: process.env.E2E_DB_ID, migrations_dir: 'cloudflare/migrations' }],
            vars: {
              PUBLIC_BASE_URL: base.origin,
              WALLET_MODE: 'testnet', WALLET_PROVIDER: 'accord_test', WALLET_NETWORK: 'accord:isolated-testnet', WALLET_CHAIN_ID: '0',
              TEST_WALLET_INITIAL_USDC_ATOMIC: '100000000',
              FEATURE_AGENT_WALLETS: 'true', FEATURE_AGENT_PAYMENTS: 'true', FEATURE_AGENT_TREASURY: 'true',
              FEATURE_ECONOMIC_TRUST: 'true', FEATURE_GUARDIAN_CONTROLS: 'true', PASSPORT_CHECKOUT_ENABLED: 'false'
            },
            observability: { enabled: false }
          };
          fs.writeFileSync('wrangler.wallet-e2e.json', JSON.stringify(config, null, 2));
          NODE

      - name: Apply schema to isolated D1
        run: npx wrangler@4.129.0 d1 migrations apply DB --remote --config wrangler.wallet-e2e.json

      - name: Generate ephemeral Passport keys and seed public keys
        shell: bash
        run: |
          set -euo pipefail
          echo "E2E_KEYS_FILE=$RUNNER_TEMP/agent-wallet-e2e-keys.json" >> "$GITHUB_ENV"
          echo "E2E_SEED_FILE=$RUNNER_TEMP/agent-wallet-e2e-seed.sql" >> "$GITHUB_ENV"
          echo "E2E_RACE_KEYS_FILE=$RUNNER_TEMP/agent-wallet-race-keys.json" >> "$GITHUB_ENV"
          echo "E2E_RACE_SEED_FILE=$RUNNER_TEMP/agent-wallet-race-seed.sql" >> "$GITHUB_ENV"
          node scripts/agent-wallet-isolated-e2e.mjs prepare "$RUNNER_TEMP/agent-wallet-e2e-keys.json" "$RUNNER_TEMP/agent-wallet-e2e-seed.sql"
          node scripts/agent-wallet-concurrency-e2e.mjs prepare "$RUNNER_TEMP/agent-wallet-race-keys.json" "$RUNNER_TEMP/agent-wallet-race-seed.sql"
          npx wrangler@4.129.0 d1 execute DB --remote --config wrangler.wallet-e2e.json --file "$RUNNER_TEMP/agent-wallet-e2e-seed.sql"
          npx wrangler@4.129.0 d1 execute DB --remote --config wrangler.wallet-e2e.json --file "$RUNNER_TEMP/agent-wallet-race-seed.sql"

      - name: Deploy isolated Worker
        run: npx wrangler@4.129.0 deploy --config wrangler.wallet-e2e.json

      - name: Install ephemeral Guardian operator secret
        shell: bash
        run: |
          set -euo pipefail
          token="$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$token"
          echo "WALLET_E2E_OPERATOR_TOKEN=$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | npx wrangler@4.129.0 secret put WALLET_OPERATOR_TOKEN --config wrangler.wallet-e2e.json >/dev/null

      - name: Run signed-agent settlement flow
        shell: bash
        run: node scripts/agent-wallet-isolated-e2e.mjs run "$E2E_BASE_URL" "$E2E_KEYS_FILE" | tee .audit/wallet-sandbox-e2e.json

      - name: Run concurrent payment and Guardian races
        shell: bash
        run: node scripts/agent-wallet-concurrency-e2e.mjs run "$E2E_BASE_URL" "$E2E_RACE_KEYS_FILE" | tee .audit/wallet-concurrency-e2e.json

      - name: Delete and verify isolated Cloudflare resources
        if: always()
        shell: bash
        run: |
          set +e
          status=0
          api='https://api.cloudflare.com/client/v4'
          expected="at-wallet-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          worker_deleted=false
          database_deleted=false
          safe_target=false

          if [[ -n "${E2E_WORKER:-}" && "$E2E_WORKER" == "$expected" && "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-f0-9]{32}$ ]]; then
            safe_target=true
            worker_url="$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$E2E_WORKER"
            delete_code="$(curl --silent --show-error --max-time 20 -o /tmp/wallet-worker-delete.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$worker_url")" || delete_code=000
            if [[ "$delete_code" == 200 || "$delete_code" == 404 ]]; then
              for attempt in 1 2 3 4 5; do
                probe_code="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$worker_url/settings")" || probe_code=000
                if [[ "$probe_code" == 404 ]]; then worker_deleted=true; break; fi
                sleep 1
              done
            fi
            [[ "$worker_deleted" == true ]] || status=1
          elif [[ -n "${E2E_WORKER:-}" ]]; then
            status=1
          fi

          if [[ -n "${E2E_DB_ID:-}" && "$safe_target" == true && "$E2E_DB_ID" =~ ^[a-f0-9-]{36}$ ]]; then
            db_url="$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$E2E_DB_ID"
            before_code="$(curl --silent --show-error --max-time 20 -o /tmp/wallet-db-before.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$db_url")" || before_code=000
            if [[ "$before_code" == 404 ]]; then
              database_deleted=true
            elif [[ "$before_code" == 200 && "$(jq -r '.result.name // empty' /tmp/wallet-db-before.json 2>/dev/null)" == "$expected" ]]; then
              delete_code="$(curl --silent --show-error --max-time 20 -o /tmp/wallet-db-delete.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$db_url")" || delete_code=000
              if [[ "$delete_code" == 200 || "$delete_code" == 404 ]]; then
                for attempt in 1 2 3 4 5; do
                  probe_code="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$db_url")" || probe_code=000
                  if [[ "$probe_code" == 404 ]]; then database_deleted=true; break; fi
                  sleep 1
                done
              fi
            fi
            [[ "$database_deleted" == true ]] || status=1
          elif [[ -n "${E2E_DB_ID:-}" ]]; then
            status=1
          fi

          rm -f /tmp/wallet-worker-delete.json /tmp/wallet-db-before.json /tmp/wallet-db-delete.json
          rm -f "${E2E_KEYS_FILE:-}" "${E2E_SEED_FILE:-}" "${E2E_RACE_KEYS_FILE:-}" "${E2E_RACE_SEED_FILE:-}" wrangler.wallet-e2e.json
          jq -nc \
            --argjson worker_deleted "$worker_deleted" \
            --argjson database_deleted "$database_deleted" \
            --argjson safe_target "$safe_target" \
            --argjson ok "$([[ $status -eq 0 ]] && echo true || echo false)" \
            '{cleanup_attempted:true,safe_target:$safe_target,worker_deleted:$worker_deleted,database_deleted:$database_deleted,status:(if $ok then "passed" else "failed" end)}' \
            > .audit/wallet-sandbox-cleanup.json
          exit $status

      - name: Archive sanitized evidence and tracked source only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-wallet-isolated-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .audit/
          include-hidden-files: true
          retention-days: 7
