name: One-time Agent Reputation partnership feedback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-reputation-partner-feedback.yml"

permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Request consent-oriented partnership feedback
        id: outreach
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outreach
          feedback="$(jq -nc '{
            skill:"give_feedback",
            args:{
              category:"collaboration",
              message:"AccordTrace proposes one no-cost, consent-first interoperability test: review whether portable proof and receipt records could accompany Agent Reputation complaint or contact evidence. Please return fit or no-fit, missing evidence fields, and one safe next test. No payment, credentials, personal data, or public attribution is requested. Offer: https://github.com/Kosta1985/notary-protocol/blob/main/partners/offers/agent-reputation-feedback.json AccordTrace Offer proof: atp_a8v8R846P7nYiKdVeWVLuo-u"
            }
          }')"
          message_id="accordtrace-agentreputation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          jq -n --arg id "$message_id" --arg text "$feedback"             '{jsonrpc:"2.0",id:$id,method:"message/send",params:{message:{kind:"message",messageId:$id,role:"user",parts:[{kind:"text",text:$text}]}}}'             > outreach/a2a-request.json
          result="$(curl --silent --show-error -X POST             -H "content-type: application/json" --data @outreach/a2a-request.json             -w '\nHTTP_STATUS:%{http_code}' "https://agentreputation.dev/api/a2a")"
          status="$(printf '%s' "$result" | sed -n 's/^HTTP_STATUS://p')"
          printf '%s' "$result" | sed '/^HTTP_STATUS:/d' > outreach/a2a-response.json
          response_hash="$(sha256sum outreach/a2a-response.json | cut -d' ' -f1)"
          printf 'a2a_http=%s\nresponse_hash=%s\n' "$status" "$response_hash" >> "$GITHUB_OUTPUT"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then exit 1; fi
          if jq -e '.error != null' outreach/a2a-response.json >/dev/null; then exit 1; fi
          jq -e '.result != null' outreach/a2a-response.json >/dev/null

      - name: Summarize without publishing response content
        if: always()
        run: |
          {
            echo "## Agent Reputation partnership feedback"
            echo "- External A2A HTTP: ${{ steps.outreach.outputs.a2a_http }}"
            echo "- Response SHA-256: ${{ steps.outreach.outputs.response_hash }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve exchange
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-reputation-partner-feedback-v2
          path: outreach/
          retention-days: 30
