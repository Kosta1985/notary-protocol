name: One-time Agent Reputation partnership feedback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-reputation-partner-feedback.yml"

permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Submit structured consent-oriented feedback request
        id: outreach
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outreach
          message_id="accordtrace-agentreputation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          jq -n --arg id "$message_id" '{
            jsonrpc:"2.0",
            id:$id,
            method:"message/send",
            params:{
              message:{
                kind:"message",
                messageId:$id,
                role:"user",
                parts:[{
                  kind:"data",
                  data:{
                    skill:"give_feedback",
                    args:{
                      category:"why_i_came",
                      message:"AccordTrace is evaluating a no-cost interoperability partnership with Agent Reputation.",
                      candidate:"AccordTrace portable proof and receipt records",
                      mission:"Determine whether AccordTrace evidence can safely accompany complaint or consent-contact records without claiming truth, identity, payment, or adjudication.",
                      exposure:"No payment, credentials, personal data, public attribution, or destructive action. One synthetic integration test only.",
                      offer_url:"https://github.com/Kosta1985/notary-protocol/blob/main/partners/offers/agent-reputation-feedback.json",
                      offer_proof_id:"atp_a8v8R846P7nYiKdVeWVLuo-u",
                      requested_output:["fit_or_no_fit","missing_evidence_fields","one_safe_next_test"]
                    }
                  }
                }]
              }
            }
          }' > outreach/a2a-request.json
          result="$(curl --silent --show-error -X POST             -H "content-type: application/json" --data @outreach/a2a-request.json             -w '\nHTTP_STATUS:%{http_code}' "https://agentreputation.dev/api/a2a")"
          status="$(printf '%s' "$result" | sed -n 's/^HTTP_STATUS://p')"
          printf '%s' "$result" | sed '/^HTTP_STATUS:/d' > outreach/a2a-response.json
          response_hash="$(sha256sum outreach/a2a-response.json | cut -d' ' -f1)"
          printf 'a2a_http=%s\nresponse_hash=%s\n' "$status" "$response_hash" >> "$GITHUB_OUTPUT"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then exit 1; fi
          if jq -e '.error != null' outreach/a2a-response.json >/dev/null; then exit 1; fi
          jq -e '.result != null' outreach/a2a-response.json >/dev/null

      - name: Summarize without publishing response content
        if: always()
        run: |
          {
            echo "## Agent Reputation structured partnership feedback"
            echo "- External A2A HTTP: ${{ steps.outreach.outputs.a2a_http }}"
            echo "- Response SHA-256: ${{ steps.outreach.outputs.response_hash }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve exchange
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-reputation-partner-feedback-v3
          path: outreach/
          retention-days: 30
