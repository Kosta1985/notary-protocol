name: AccordTrace edge-case baseline
on:
  push:
    branches: [audit/site-edge-cases-20260905]
    paths: [.github/workflows/site-edge-audit.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Archive tracked source and run local tests
        run: |
          mkdir -p .audit
          git archive --format=zip --output=.audit/source.zip HEAD
          set -o pipefail
          npm test 2>&1 | tee .audit/unit-tests.log | tail -n 20
      - name: Read-only production HTTP baseline
        run: node scripts/audit/website-system.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-edge-baseline-${{ github.sha }}
          path: .audit/
          include-hidden-files: true
          retention-days: 3
