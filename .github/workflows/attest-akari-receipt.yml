name: One-time attest external agent receipt

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/attest-akari-receipt.yml"

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create AccordTrace attestation
        id: attest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          receipt_url="https://raw.githubusercontent.com/Kosta1985/notary-protocol/main/partners/receipts/akari-20260825-01.json"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "$receipt_url" -o evidence/receipt.json
          jq -n --slurpfile data evidence/receipt.json             '{data:$data[0],metadata:{source:"external-agent-receipt",purpose:"partner-interoperability-result"}}'             > evidence/proof-request.json
          result="$(curl --silent --show-error -X POST             -H "content-type: application/json"             --data @evidence/proof-request.json             -w '\nHTTP_STATUS:%{http_code}'             "https://accordtrace.notary-labs.workers.dev/api/v1/proofs")"
          status="$(printf '%s' "$result" | sed -n 's/^HTTP_STATUS://p')"
          printf '%s' "$result" | sed '/^HTTP_STATUS:/d' > evidence/accordtrace-proof.json
          proof_id="$(jq -r '.proof_id // empty' evidence/accordtrace-proof.json)"
          printf 'http=%s\nproof_id=%s\n' "$status" "$proof_id" >> "$GITHUB_OUTPUT"
          if [[ "$status" -lt 200 || "$status" -ge 300 || -z "$proof_id" ]]; then exit 1; fi

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## External agent receipt attestation"
            echo "- AccordTrace HTTP: ${{ steps.attest.outputs.http }}"
            echo "- Proof ID: ${{ steps.attest.outputs.proof_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akari-receipt-attestation
          path: evidence/
          retention-days: 30
