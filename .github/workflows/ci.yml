name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: Verify Accord Trace metadata consistency
        run: npm run accordtrace:metadata
      - run: python -m compileall -q sdk/python/notary_protocol
