name: One-time agent marketplace submission

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/marketplace-audit.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit AccordTrace to Global A2A Registry
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.a2a-registry.org"
          agent_url="https://accordtrace.notary-labs.workers.dev"
          payload="$(jq -nc --arg url "$agent_url" '{url:$url}')"

          scan="$(curl --fail --silent --show-error             -X POST -H "content-type: application/json"             --data "$payload" "$api/public/ingest/scan")"
          printf 'Scan result:\n'
          printf '%s' "$scan" | jq '{success, error, data}'

          if [[ "$(printf '%s' "$scan" | jq -r '.success // false')" != "true" ]] ||
             [[ "$(printf '%s' "$scan" | jq -r '.data.found // false')" != "true" ]]; then
            echo "Registry scan did not detect the live agent."
            exit 1
          fi

          result="$(curl --silent --show-error             -X POST -H "content-type: application/json"             --data "$payload"             -w '\nHTTP_STATUS:%{http_code}'             "$api/public/ingest/submit-and-claim")"
          status="$(printf '%s' "$result" | sed -n 's/^HTTP_STATUS://p')"
          body="$(printf '%s' "$result" | sed '/^HTTP_STATUS:/d')"
          printf 'Submission HTTP %s\n' "$status"
          printf '%s' "$body" | jq .
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            exit 1
          fi

      - name: Confirm Moltbook public identity
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error             "https://www.moltbook.com/api/v1/search?q=AccordTrace")"
          printf '%s' "$result" | jq '{
            success,
            accordtrace: [
              .results[] |
              select(.type == "agent" and (.title | ascii_downcase) == "accordtrace") |
              {title, content, created_at, url}
            ]
          }'
          test "$(printf '%s' "$result" | jq '[.results[] | select(.type == "agent" and (.title | ascii_downcase) == "accordtrace")] | length')" -ge 1
