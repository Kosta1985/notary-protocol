name: AccordTrace website system audit

on:
  workflow_dispatch:
  push:
    branches: [audit/accordtrace-system-check-20260905]
  workflow_run:
    workflows: ["Deploy AccordTrace production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: website-system-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit and integration tests
        run: |
          mkdir -p .audit
          set -o pipefail
          npm test 2>&1 | tee .audit/unit-tests.log | tail -n 55
      - name: Validate prepared release assets
        run: |
          npm run production:check
          npm run cf:prepare
          npm run accordtrace:metadata
      - name: Read-only live HTTP and link audit
        if: always()
        run: node scripts/audit/website-system.mjs
      - name: Install isolated browser tooling
        if: always()
        run: |
          npm install --prefix "$RUNNER_TEMP/accordtrace-browser" --no-package-lock --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/accordtrace-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/accordtrace-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Read-only desktop and mobile browser audit
        if: always()
        run: node scripts/audit/website-browser.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accordtrace-system-audit-${{ github.sha }}
          path: .audit/
          include-hidden-files: true
          retention-days: 7
