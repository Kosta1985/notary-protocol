name: One-time PaKi catalog receipt pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paki-catalog-pilot.yml"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Attest bounded offer
        shell: bash
        run: |
          set -euo pipefail
          jq -n --slurpfile offer partners/offers/paki-catalog-overview.json             '{data:$offer[0],metadata:{source:"accordtrace-founding-agent-program",record_type:"external_agent_offer"}}'             > offer-proof-request.json
          curl --silent --show-error --fail-with-body -X POST             https://accordtrace.notary-labs.workers.dev/api/v1/proofs             -H "content-type: application/json"             --data-binary @offer-proof-request.json > offer-proof-response.json
          jq -e '.proof_id != null' offer-proof-response.json >/dev/null

      - name: Initialize MCP and call catalog_overview
        id: mcp
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://paki-api.elfresonero.workers.dev/mcp"

          normalize_mcp() {
            local raw="$1"
            local output="$2"
            if jq -e . "$raw" >/dev/null 2>&1; then
              jq -c . "$raw" > "$output"
            else
              sed -n 's/^data: //p' "$raw" | tail -n 1 > "$output"
              jq -e . "$output" >/dev/null
            fi
          }

          jq -n '{
            jsonrpc:"2.0",
            id:"accordtrace-paki-init-20260826",
            method:"initialize",
            params:{
              protocolVersion:"2025-03-26",
              capabilities:{},
              clientInfo:{name:"AccordTrace Interoperability Pilot",version:"0.1.0"}
            }
          }' > mcp-initialize-request.json

          curl --silent --show-error --fail-with-body             -D mcp-initialize-headers.txt             -o mcp-initialize-raw.txt             -X POST "$endpoint"             -H "content-type: application/json"             -H "accept: application/json, text/event-stream"             --data-binary @mcp-initialize-request.json
          normalize_mcp mcp-initialize-raw.txt mcp-initialize-response.json
          jq -e '.result.protocolVersion != null and .error == null' mcp-initialize-response.json >/dev/null

          session_id="$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/ {gsub("\r","",$2); print $2}' mcp-initialize-headers.txt | tail -n 1)"
          session_args=()
          if [[ -n "$session_id" ]]; then
            session_args=(-H "Mcp-Session-Id: $session_id")
          fi

          jq -n '{jsonrpc:"2.0",method:"notifications/initialized"}' > mcp-initialized-notification.json
          curl --silent --show-error --fail-with-body             -o mcp-initialized-response.txt             -X POST "$endpoint"             -H "content-type: application/json"             -H "accept: application/json, text/event-stream"             "${session_args[@]}"             --data-binary @mcp-initialized-notification.json

          jq -n '{
            jsonrpc:"2.0",
            id:"accordtrace-paki-tools-20260826",
            method:"tools/list",
            params:{}
          }' > mcp-tools-request.json
          curl --silent --show-error --fail-with-body             -o mcp-tools-raw.txt             -X POST "$endpoint"             -H "content-type: application/json"             -H "accept: application/json, text/event-stream"             "${session_args[@]}"             --data-binary @mcp-tools-request.json
          normalize_mcp mcp-tools-raw.txt mcp-tools-response.json
          jq -e '.result.tools[]? | select(.name == "catalog_overview")' mcp-tools-response.json >/dev/null

          jq -n '{
            jsonrpc:"2.0",
            id:"accordtrace-paki-catalog-20260826",
            method:"tools/call",
            params:{name:"catalog_overview",arguments:{}}
          }' > mcp-call-request.json
          curl --silent --show-error --fail-with-body             -o mcp-call-raw.txt             -X POST "$endpoint"             -H "content-type: application/json"             -H "accept: application/json, text/event-stream"             "${session_args[@]}"             --data-binary @mcp-call-request.json
          normalize_mcp mcp-call-raw.txt mcp-call-response.json
          jq -e '.error == null and .result != null and (.result.isError != true)' mcp-call-response.json >/dev/null

          printf 'session=%s\n' "$(if [[ -n "$session_id" ]]; then echo issued; else echo stateless; fi)" >> "$GITHUB_OUTPUT"

      - name: Build and attest bounded receipt
        shell: bash
        run: |
          set -euo pipefail
          offer_proof_id="$(jq -r '.proof_id' offer-proof-response.json)"
          init_hash="$(sha256sum mcp-initialize-response.json | cut -d' ' -f1)"
          tools_hash="$(sha256sum mcp-tools-response.json | cut -d' ' -f1)"
          request_hash="$(sha256sum mcp-call-request.json | cut -d' ' -f1)"
          response_hash="$(sha256sum mcp-call-response.json | cut -d' ' -f1)"
          tool_count="$(jq -r '.result.tools | length' mcp-tools-response.json)"
          content_items="$(jq -r '(.result.content // []) | length' mcp-call-response.json)"
          text_bytes="$(jq -r '[.result.content[]?.text // ""] | join("") | utf8bytelength' mcp-call-response.json)"
          server_name="$(jq -r '.result.serverInfo.name // "not-declared"' mcp-initialize-response.json)"
          server_version="$(jq -r '.result.serverInfo.version // "not-declared"' mcp-initialize-response.json)"

          jq -n             --arg offer_proof_id "$offer_proof_id"             --arg init_hash "$init_hash"             --arg tools_hash "$tools_hash"             --arg request_hash "$request_hash"             --arg response_hash "$response_hash"             --arg server_name "$server_name"             --arg server_version "$server_version"             --argjson tool_count "$tool_count"             --argjson content_items "$content_items"             --argjson text_bytes "$text_bytes"             --arg workflow "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"             '{
              receipt_version:"accordtrace-partner-receipt/0.1",
              receipt_id:"partner_rcpt_paki_20260826_01",
              deduplication_key:("mcp-response:"+$response_hash),
              offer_id:"offer_accordtrace_paki_catalog_20260826_01",
              observed_at:(now|todateiso8601),
              parties:{proposer:"accordtrace",counterparty:"paki-curator"},
              outcome:{
                result_type:"external_mcp_tool_result",
                protocol:"MCP 2025-03-26",
                tool:"catalog_overview",
                arguments:{},
                tool_call_succeeded:true,
                content_item_count:$content_items,
                response_text_bytes:$text_bytes,
                counted_as_result:true
              },
              discovery:{
                server_name:$server_name,
                server_version:$server_version,
                listed_tool_count:$tool_count,
                requested_tool_listed:true
              },
              evidence:{
                offer_proof_id:$offer_proof_id,
                workflow_run:$workflow,
                initialize_response_sha256:("sha256:"+$init_hash),
                tools_list_response_sha256:("sha256:"+$tools_hash),
                call_request_sha256:("sha256:"+$request_hash),
                call_response_sha256:("sha256:"+$response_hash)
              },
              safety:{
                read_only_catalog_call:true,
                request_inquiry_called:false,
                outreach_called:false,
                payment_called:false,
                credentials_supplied:false,
                personal_data_supplied:false
              },
              partnership:{
                offer_sent:true,
                external_task_completed:true,
                program_acceptance_received:false,
                notary_acceptance_signature_received:false,
                public_attribution:false
              },
              boundary:"This receipt records one public, read-only PaKi MCP catalog_overview result. It does not validate the truth, completeness, currency, ownership, pricing, availability, commercial suitability, partnership acceptance, or endorsement of the catalog or its contents."
            }' > receipt.json

          jq -n --slurpfile receipt receipt.json             '{data:$receipt[0],metadata:{source:"accordtrace-founding-agent-program",record_type:"external_mcp_result_receipt"}}'             > receipt-proof-request.json
          curl --silent --show-error --fail-with-body -X POST             https://accordtrace.notary-labs.workers.dev/api/v1/proofs             -H "content-type: application/json"             --data-binary @receipt-proof-request.json > receipt-proof-response.json
          jq -e '.proof_id != null' receipt-proof-response.json >/dev/null

      - name: Summarize without reproducing catalog content
        if: always()
        run: |
          {
            echo "## PaKi catalog receipt pilot"
            echo "- MCP session: ${{ steps.mcp.outputs.session }}"
            echo "- Offer proof: $(jq -r '.proof_id // "unavailable"' offer-proof-response.json 2>/dev/null || true)"
            echo "- Receipt proof: $(jq -r '.proof_id // "unavailable"' receipt-proof-response.json 2>/dev/null || true)"
            echo "- Tool result: $(jq -r '.outcome.tool_call_succeeded // false' receipt.json 2>/dev/null || true)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paki-catalog-pilot
          path: |
            offer-proof-response.json
            mcp-initialize-request.json
            mcp-initialize-response.json
            mcp-tools-request.json
            mcp-tools-response.json
            mcp-call-request.json
            mcp-call-response.json
            receipt.json
            receipt-proof-response.json
          retention-days: 30
