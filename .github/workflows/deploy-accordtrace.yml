name: Deploy AccordTrace production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "cloudflare/**"
      - "scripts/prepare-cloudflare-assets.js"
      - "docs/openapi-fragments/**"
      - ".github/workflows/deploy-accordtrace.yml"

permissions:
  contents: read

concurrency:
  group: accordtrace-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN_3: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_4: ${{ secrets.CF_TOKEN }}
      CF_ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Detect Cloudflare deployment credentials
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          token=""
          for candidate in "${CF_TOKEN_1:-}" "${CF_TOKEN_2:-}" "${CF_TOKEN_3:-}" "${CF_TOKEN_4:-}"; do
            if [[ -n "$candidate" ]]; then token="$candidate"; break; fi
          done
          if [[ -z "$token" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: no API token is configured in this repository. CI will still test the release candidate."
            exit 0
          fi
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"

          account_id=""
          for candidate in "${CF_ACCOUNT_1:-}" "${CF_ACCOUNT_2:-}" "${CF_ACCOUNT_3:-}" "${CF_ACCOUNT_4:-}"; do
            if [[ -n "$candidate" ]]; then account_id="$candidate"; break; fi
          done
          if [[ -z "$account_id" ]]; then
            account_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $token" https://api.cloudflare.com/client/v4/accounts)"
            account_id="$(printf '%s' "$account_json" | jq -r '.result[0].id // empty')"
          fi
          if [[ -z "$account_id" ]]; then
            echo "A Cloudflare token exists but no account could be resolved." >&2
            exit 2
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Preserve live AccordTrace D1 binding
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          settings="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/accordtrace/settings")"
          db_id="$(printf '%s' "$settings" | jq -r '.result.bindings[]? | select(.type == "d1" and .name == "DB") | (.id // .database_id // empty)' | head -n1)"
          if [[ -z "$db_id" ]]; then
            databases="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")"
            db_id="$(printf '%s' "$databases" | jq -r '.result[]? | select(.name == "accordtrace" or .name == "notary-protocol") | .uuid' | head -n1)"
          fi
          if [[ -z "$db_id" ]]; then
            echo "Could not resolve the production D1 database; refusing to deploy." >&2
            exit 3
          fi
          node - "$db_id" <<'NODE'
          import fs from 'node:fs';
          const dbId = process.argv[2];
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.name = 'accordtrace';
          config.d1_databases[0].database_id = dbId;
          fs.writeFileSync('wrangler.production.json', JSON.stringify(config, null, 2));
          NODE

      - name: Apply production D1 migrations
        if: steps.cf.outputs.available == 'true'
        run: npx wrangler@latest d1 migrations apply DB --remote --config wrangler.production.json

      - name: Prepare production assets
        if: steps.cf.outputs.available == 'true'
        run: npm run cf:prepare

      - name: Deploy live worker and assets
        if: steps.cf.outputs.available == 'true'
        run: npx wrangler@latest deploy --config wrangler.production.json

      - name: Verify homepage, security, trust and gateway APIs
        if: steps.cf.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error -H 'x-notary-monitor: live-smoke' https://accordtrace.notary-labs.workers.dev/)"
          printf '%s' "$body" | grep -q 'Infrastructure for accountable AI agents'
          if printf '%s' "$body" | grep -q 'class="brand-mark"'; then
            echo "Old brand mark is still present" >&2
            exit 4
          fi
          curl --fail --silent --show-error https://accordtrace.notary-labs.workers.dev/health
          security="$(curl --fail --silent --show-error https://accordtrace.notary-labs.workers.dev/api/v1/security/capabilities)"
          printf '%s' "$security" | grep -q 'AccordTrace Agent Security & Trust'
          printf '%s' "$security" | grep -q 'passive_canaries'
          trust="$(curl --fail --silent --show-error https://accordtrace.notary-labs.workers.dev/api/v1/trust/capabilities)"
          printf '%s' "$trust" | grep -q 'AccordTrace Reputation Evidence'
          printf '%s' "$trust" | grep -q 'bilateral_payment_evidence'
          gateway="$(curl --fail --silent --show-error https://accordtrace.notary-labs.workers.dev/api/v1/gateway/capabilities)"
          printf '%s' "$gateway" | grep -q 'AccordTrace Capability Gateway'
          printf '%s' "$gateway" | grep -q 'issuer_kill_switch'
          openapi="$(curl --fail --silent --show-error https://accordtrace.notary-labs.workers.dev/openapi.json)"
          printf '%s' "$openapi" | grep -q '/api/v1/gateway/authorize'

      - name: Deployment status
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.cf.outputs.available }}" == "true" ]]; then
            echo "Cloudflare deployment path was enabled for this run."
          else
            echo "Release candidate tested successfully; Cloudflare deployment remains pending because repository credentials are not configured."
          fi
