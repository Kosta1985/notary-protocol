name: Manual Cloudflare inventory audit

on:
  workflow_dispatch:
    inputs:
      confirm_audit:
        description: 'Type AUDIT to run the read-only Cloudflare inventory audit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: accordtrace-cloudflare-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.confirm_audit == 'AUDIT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Create ephemeral transport key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out cloudflare-audit-public.pem 2>/dev/null
      - name: Expose ephemeral public key
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-audit-key
          path: cloudflare-audit-public.pem
          retention-days: 1
      - name: Wait for encrypted Cloudflare token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/.cloudflare/audit-token.enc.b64?ref=main" \
              -o /tmp/token.enc.b64; then
              break
            fi
            sleep 5
          done
          test -s /tmp/token.enc.b64
          base64 -d /tmp/token.enc.b64 > /tmp/token.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/token.enc -out /tmp/token.txt
          test -s /tmp/token.txt
      - name: Inventory Workers and aggregate D1 row counts
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/token.txt)"
          api="https://api.cloudflare.com/client/v4"
          verify="$(curl --silent --show-error -H "Authorization: Bearer $token" "$api/user/tokens/verify")"
          printf '%s' "$verify" | jq '{success, status: .result.status, errors: [.errors[]? | {code, message}]}'
          accounts="$(curl --silent --show-error -H "Authorization: Bearer $token" "$api/accounts")"
          printf '%s' "$accounts" | jq '{success, accounts: [.result[]? | {id, name}], errors: [.errors[]? | {code, message}]}'
          if [[ "$(printf '%s' "$accounts" | jq -r '.success')" != "true" ]]; then
            exit 2
          fi
          printf '%s' "$accounts" | jq -r '.result[] | "account: \(.name) [\(.id)]"'
          while IFS=$'\t' read -r account_id account_name; do
            echo "## Account: $account_name" >> "$GITHUB_STEP_SUMMARY"
            scripts="$(curl --fail --silent --show-error -H "Authorization: Bearer $token" "$api/accounts/$account_id/workers/scripts")"
            printf '%s' "$scripts" | jq -r '.result[]?.id | "worker: \(.)"'
            databases="$(curl --fail --silent --show-error -H "Authorization: Bearer $token" "$api/accounts/$account_id/d1/database?per_page=100")"
            printf '%s' "$databases" | jq -r '.result[]? | "database: \(.name) [\(.uuid)]"'
            while IFS=$'\t' read -r database_id database_name; do
              schema_payload="$(jq -nc --arg sql "SELECT name FROM sqlite_schema WHERE type = 'table' AND name NOT LIKE 'sqlite_%' ORDER BY name" '{sql:$sql}')"
              schema="$(curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer $token" -H "content-type: application/json" \
                --data "$schema_payload" \
                "$api/accounts/$account_id/d1/database/$database_id/query")"
              tables="$(printf '%s' "$schema" | jq -r '.result[]?.results[]?.name // empty')"
              while IFS= read -r table; do
                case "$table" in (*[!A-Za-z0-9_]*) continue;; esac
                counts="$(curl --fail --silent --show-error -X POST \
                  -H "Authorization: Bearer $token" -H "content-type: application/json" \
                  --data "$(jq -nc --arg sql "SELECT COUNT(*) AS row_count FROM $table" '{sql:$sql}')" \
                  "$api/accounts/$account_id/d1/database/$database_id/query")"
                count="$(printf '%s' "$counts" | jq -r '.result[]?.results[0]?.row_count // "unavailable"')"
                printf 'database=%s table=%s rows=%s\n' "$database_name" "$table" "$count"
                printf -- '- `%s.%s`: %s rows\n' "$database_name" "$table" "$count" >> "$GITHUB_STEP_SUMMARY"
              done <<< "$tables"
            done < <(printf '%s' "$databases" | jq -r '.result[]? | [.uuid, .name] | @tsv')
          done < <(printf '%s' "$accounts" | jq -r '.result[] | [.id, .name] | @tsv')
      - name: Cleanup sensitive transport material
        if: always()
        run: rm -f /tmp/token.txt /tmp/token.enc /tmp/token.enc.b64 /tmp/private.pem
      - name: Safety note
        run: |
          echo 'This workflow has no push or schedule trigger.'
          echo 'The read-only audit requires workflow_dispatch plus the exact AUDIT confirmation.'
