name: Passport signing preflight

on:
  push:
    branches: [ops/passport-signing-preflight-20260905]
    paths: [.github/workflows/passport-signing-preflight.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Inspect names and aggregate issuance only
        env:
          CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          CF_TOKEN_4: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
          TEST_STRIPE_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          mkdir -p .audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token=[1,2,3,4].map(n=>process.env[`CF_TOKEN_${n}`]).find(Boolean);
          if(!token)throw new Error('Cloudflare credential unavailable');
          const api='https://api.cloudflare.com/client/v4';
          async function cf(path,query){
            const response=await fetch(api+path,{method:query?'POST':'GET',headers:{authorization:`Bearer ${token}`,...(query?{'content-type':'application/json'}:{})},...(query?{body:JSON.stringify({sql:query})}:{}),redirect:'error',signal:AbortSignal.timeout(15000)});
            let data;try{data=await response.json()}catch{throw new Error('Cloudflare response was not JSON')}
            if(!response.ok||!data.success)throw new Error(`Cloudflare inspection failed: HTTP ${response.status}`);
            return data.result;
          }
          let account=[1,2,3,4].map(n=>process.env[`CF_ACCOUNT_${n}`]).find(Boolean);
          if(!account){const accounts=await cf('/accounts');if(accounts.length!==1)throw new Error('Ambiguous Cloudflare account');account=accounts[0].id;}
          if(!/^[a-f0-9]{32}$/.test(account))throw new Error('Invalid account identifier');
          const settings=await cf(`/accounts/${account}/workers/scripts/accordtrace/settings`);
          const bindings=settings.bindings||[];
          const signer=bindings.find(b=>b.name==='NOTARY_PRIVATE_JWK');
          const db=bindings.find(b=>b.name==='DB'&&b.type==='d1');
          const result={checked_at:new Date().toISOString(),scope:'Read-only binding names/types, issuer state and aggregate issuance. No secret values, individual records or mutations.',signer_binding:{present:Boolean(signer),type:signer?.type||null},relevant_bindings:bindings.filter(b=>/^(NOTARY_|PROOF_|STRIPE_)/.test(b.name)).map(b=>({name:b.name,type:b.type})),github_test_stripe_key_configured:Boolean(process.env.TEST_STRIPE_KEY),issuance:null,production:null};
          const dbId=db?.id||db?.database_id;
          if(dbId&&/^[a-f0-9-]{36}$/.test(dbId)){
            result.issuance={};
            for(const [name,sql] of [
              ['certificates','SELECT COUNT(*) AS count FROM agent_passport_certificates'],
              ['orders_by_state','SELECT payment_status, COUNT(*) AS count FROM passport_product_orders GROUP BY payment_status'],
              ['proof_integrity_modes',"SELECT json_extract(receipt,'$.integrity_mode') AS integrity_mode, COUNT(*) AS count FROM receipts WHERE deal_id='accordtrace-proof-v1' AND json_valid(receipt) GROUP BY integrity_mode"]
            ]){try{result.issuance[name]=await cf(`/accounts/${account}/d1/database/${dbId}/query`,sql)}catch{result.issuance[name]={inspection_available:false}}}
          }
          const response=await fetch('https://accordtrace.notary-labs.workers.dev/api/v1/passport-product/capabilities',{headers:{'x-notary-monitor':'signing-preflight'},signal:AbortSignal.timeout(15000)});
          if(response.ok){const p=await response.json();result.production={checkout_enabled:p.checkout_enabled,webhook_enabled:p.webhook_enabled,certificate_signing_enabled:p.certificate_signing_enabled,commercial_ready:p.commercial_ready};}
          fs.writeFileSync('.audit/signing-preflight.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: Archive public tracked source for isolated regression testing
        if: always()
        run: |
          mkdir -p .audit
          git archive --format=zip --output=.audit/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passport-signing-preflight-${{ github.sha }}
          path: .audit/
          include-hidden-files: true
          retention-days: 3
