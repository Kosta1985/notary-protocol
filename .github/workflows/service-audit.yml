name: Audit live AccordTrace services

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/service-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public service identity and aggregate activity
        shell: bash
        run: |
          set -u
          for service in accordtrace accord-trace notary-protocol; do
            base="https://${service}.notary-labs.workers.dev"
            echo "## ${service}" >> "$GITHUB_STEP_SUMMARY"
            for path in / /health /v1/stats /api/v1/stats "/api/v1/proofs?limit=0" /.well-known/agent-card.json /openapi.json; do
              body_file="$(mktemp)"
              code="$(curl --silent --show-error -H 'x-notary-monitor: live-smoke' -o "$body_file" -w '%{http_code}' "${base}${path}" || true)"
              body="$(cat "$body_file")"
              rm -f "$body_file"
              printf '%s %s%s\n%s\n' "$code" "$base" "$path" "$body"
              printf '**%s**: HTTP %s\n\n```\n%s\n```\n' "$path" "$code" "$body" >> "$GITHUB_STEP_SUMMARY"
            done
          done
