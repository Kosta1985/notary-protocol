name: Campaign starter synthetic smoke
on:
  push:
    branches: [ops/campaign-proof-smoke-20260905]
    paths: [.github/workflows/campaign-proof-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: One synthetic record, original match, mutation rejection
        run: |
          mkdir -p .audit
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {runChallenge} from './examples/agent-handoff/campaign.mjs';
          const base='https://accordtrace.notary-labs.workers.dev';
          const headers={'x-notary-monitor':'campaign-prelaunch-check','x-accordtrace-telemetry':'exclude'};
          const get=async path=>{const r=await fetch(base+path,{headers,redirect:'error',signal:AbortSignal.timeout(10000)});assert.equal(r.ok,true);return r.json();};
          const report={checked_at:new Date().toISOString(),scope:'Exactly one deliberately synthetic public proof and two verification requests. No real customer, agent enrollment, lead, payment, commission or secret change.',status:'failed'};
          try{
            const release=await get('/api/v1/launch/capabilities');
            assert.equal(release.release_sha,'48d4c0cd39968bd57d8257674b315dc45cd581f3','Production changed; stop before any synthetic write');
            report.production_release=release.release_sha;
            const before=await get('/api/v1/passport-product/capabilities');
            assert.equal(before.checkout_activation_enabled,false);assert.equal(before.commercial_ready,false);assert.equal(before.cash_affiliate_payouts_enabled,false);
            let requests=0;
            report.result=await runChallenge({source:'website',fetchImpl:(url,init)=>{
              assert.ok(url.startsWith(base+'/api/v1/'));assert.ok(++requests<=3);
              return fetch(url,{...init,headers:{...init.headers,...headers}});
            }});
            assert.equal(requests,3);assert.equal(report.result.signature_valid,true);
            const stored=await get('/api/v1/proofs/'+report.result.proof_id);
            assert.equal(stored.metadata.synthetic,true);
            report.synthetic_verified=true;report.requests_submitted=requests;
            const after=await get('/api/v1/passport-product/capabilities');
            assert.equal(after.checkout_activation_enabled,false);assert.equal(after.commercial_ready,false);assert.equal(after.cash_affiliate_payouts_enabled,false);
            report.checkout_remained_on_hold=true;report.status='ok';
          }catch(error){report.error=error.message;process.exitCode=1;}
          fs.writeFileSync('.audit/campaign-starter-smoke.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-starter-smoke-${{ github.sha }}
          path: .audit/
          include-hidden-files: true
          retention-days: 7
