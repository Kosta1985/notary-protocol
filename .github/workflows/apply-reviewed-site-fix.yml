name: Validate reviewed website candidate

on:
  push:
    branches: [fix/site-verification-resilience-20260905]
    paths: [.github/workflows/apply-reviewed-site-fix.yml, '.ci-candidate/**']

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply hash-verified source edits as data only
        run: |
          mkdir -p .audit
          python - <<'PY'
          import hashlib,json,lzma,pathlib
          root=pathlib.Path('.').resolve()
          compressed=b''.join((root/f'.ci-candidate/site.{i}.part').read_bytes() for i in range(1,5))
          assert hashlib.sha256(compressed).hexdigest()=='47218e7b160d8f7c84ebc858daacd515cb4a9c51c9382c0bbb9abc3e029c9a2a','Transport integrity mismatch'
          raw=lzma.decompress(compressed)
          assert len(raw)<1_000_000
          manifest=json.loads(raw)
          assert manifest['base_sha']=='b989ec2d21622729b6235ea722ec8bfff69c4ea0'
          assert len(manifest['files'])==38
          runtime={'http-request.js','index.js','interoperability.js','proofs.js','response-security.js','usage-analytics.js','worker-v2.js'}
          prepared=[]
          for entry in manifest['files']:
              name=entry['path']; p=root/name
              assert '..' not in pathlib.PurePosixPath(name).parts and not name.startswith('/')
              assert name.startswith('web/') or (name.startswith('cloudflare/src/') and p.name in runtime) or name in ['test/http-safety.test.js','test/public-evidence.test.js','test/telemetry-exclusion.test.js','scripts/audit/website-interactions.mjs']
              assert not p.is_symlink()
              before=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None)==entry['before_sha256'],f'Baseline changed: {name}'
              text=before.decode('utf-8') if before is not None else ''
              previous=0
              for start,end,replacement in entry['edits']:
                  assert 0<=previous<=start<=end<=len(text) and isinstance(replacement,str)
                  previous=end
              for start,end,replacement in reversed(entry['edits']):text=text[:start]+replacement+text[end:]
              content=text.encode('utf-8')
              assert len(content)<1_000_000 and hashlib.sha256(content).hexdigest()==entry['after_sha256'],f'Candidate hash mismatch: {name}'
              if name=='web/site-resilience.css':
                  assert entry['after_sha256']=='c321c87468275f3abd89ee5d798c169b88506fc56be23dd949ecfd1cad5f86cf'
                  content=text.replace('*,*::before,*::after{box-sizing:border-box}\n','*,*::before,*::after{box-sizing:border-box}\n[hidden]{display:none!important}\n').encode('utf-8')
                  entry['after_sha256']='646ac6fc9f228dbe568fe3a77f400857583761aeb2ac7eaa33d26ecaf14dddfb'
                  assert hashlib.sha256(content).hexdigest()==entry['after_sha256']
              prepared.append((p,content))
          for p,content in prepared:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content)
          evidence={'base_sha':manifest['base_sha'],'files':[{k:v for k,v in e.items() if k!='edits'} for e in manifest['files']]}
          (root/'.audit/transport-manifest.json').write_text(json.dumps(evidence,indent=2))
          print('Applied 38 verified source files; payment handlers, secrets, deployment configuration and domains were not changed.')
          PY
      - name: Unit, source and release checks without credentials
        run: |
          set -o pipefail
          npm test 2>&1 | tee .audit/candidate-tests.log | tail -n 15
          npm run production:check
          npm run cf:prepare
          npm run accordtrace:metadata
          npm run release:audit
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/site-browser" --no-package-lock --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/site-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/site-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Exercise isolated browser regressions
        run: node scripts/audit/website-interactions.mjs
      - name: Publish tested plaintext files to this feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,hashlib,urllib.request
          repo='Kosta1985/notary-protocol';branch='fix/site-verification-resilience-20260905';head=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']==repo and os.environ['GITHUB_REF']=='refs/heads/'+branch
          def api(path,method='GET',body=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=json.dumps(body).encode() if body is not None else None,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          assert api('/git/ref/heads/'+branch)['object']['sha']==head,'Feature branch changed; stop'
          manifest=json.loads(pathlib.Path('.audit/transport-manifest.json').read_text())
          entries=[]
          for e in manifest['files']:
              data=pathlib.Path(e['path']).read_bytes();assert hashlib.sha256(data).hexdigest()==e['after_sha256']
              entries.append({'path':e['path'],'mode':'100644','type':'blob','content':data.decode('utf-8')})
          tree=api('/git/trees','POST',{'base_tree':api('/git/commits/'+head)['tree']['sha'],'tree':entries})
          commit=api('/git/commits','POST',{'message':'Fix public verification, resilient forms, mobile navigation and HTTP safety','tree':tree['sha'],'parents':[head]})
          assert api('/git/ref/heads/'+branch)['object']['sha']==head,'Feature branch changed; stop'
          api('/git/refs/heads/'+branch,'PATCH',{'sha':commit['sha'],'force':False})
          pathlib.Path('.audit/published-candidate.json').write_text(json.dumps({'branch':branch,'commit':commit['sha'],'tree':tree['sha'],'files':len(entries),'tests_passed':True,'browser_fixtures_passed':True},indent=2))
          print('Published tested feature-branch candidate '+commit['sha']+'; main and production unchanged.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tested-site-candidate-${{ github.sha }}
          path: .audit/
          include-hidden-files: true
          retention-days: 7
