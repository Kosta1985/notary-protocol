name: One-time external agent partnership offer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/akari-partner-offer.yml"

permissions:
  contents: read

jobs:
  offer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Create AccordTrace evidence for the Offer
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outreach
          offer_url="https://raw.githubusercontent.com/Kosta1985/notary-protocol/main/partners/offers/akari-result-receipt-auditor.json"
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "$offer_url" -o outreach/offer.json
          jq -n --slurpfile data outreach/offer.json             '{data:$data[0],metadata:{source:"accordtrace-partner-outreach",purpose:"partner-offer"}}'             > outreach/proof-request.json
          result="$(curl --silent --show-error -X POST             -H "content-type: application/json"             --data @outreach/proof-request.json             -w '\nHTTP_STATUS:%{http_code}'             "https://accordtrace.notary-labs.workers.dev/api/v1/proofs")"
          status="$(printf '%s' "$result" | sed -n 's/^HTTP_STATUS://p')"
          printf '%s' "$result" | sed '/^HTTP_STATUS:/d' > outreach/accordtrace-proof.json
          printf 'proof_http=%s\n' "$status" >> "$GITHUB_OUTPUT"
          jq . outreach/accordtrace-proof.json
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then exit 1; fi

      - name: Send signed-evidence Offer to external A2A agent
        id: a2a
        shell: bash
        run: |
          set -euo pipefail
          message_id="accordtrace-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          compact_offer="$(jq -c . outreach/offer.json)"
          compact_proof="$(jq -c . outreach/accordtrace-proof.json)"
          text="$(printf '%s\n\nOffer: %s\nAccordTrace evidence: %s\n\nPlease perform the requested audit. If you wish to join the free program, return the acceptance fields from the Offer. Public attribution defaults to false.'             'AccordTrace invites AIﾉアカリ☆ Result Receipt Auditor to a no-cost Notary Protocol interoperability transaction.'             "$compact_offer" "$compact_proof")"
          jq -n --arg id "$message_id" --arg text "$text"             '{jsonrpc:"2.0",id:$id,method:"message/send",params:{message:{messageId:$id,role:"user",parts:[{kind:"text",text:$text}]}}}'             > outreach/a2a-request.json
          result="$(curl --silent --show-error -X POST             -H "content-type: application/json"             --data @outreach/a2a-request.json             -w '\nHTTP_STATUS:%{http_code}'             "https://ai-akari.ai/a2a/result-receipt-auditor")"
          status="$(printf '%s' "$result" | sed -n 's/^HTTP_STATUS://p')"
          printf '%s' "$result" | sed '/^HTTP_STATUS:/d' > outreach/a2a-response.json
          printf 'a2a_http=%s\n' "$status" >> "$GITHUB_OUTPUT"
          jq . outreach/a2a-response.json || cat outreach/a2a-response.json
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then exit 1; fi

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## External agent partnership offer"
            echo "- AccordTrace proof HTTP: ${{ steps.proof.outputs.proof_http }}"
            echo "- External A2A HTTP: ${{ steps.a2a.outputs.a2a_http }}"
            echo "- Target: AIﾉアカリ☆ Result Receipt Auditor"
            echo "- Offer: offer_accordtrace_akari_audit_20260825_01"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve exchange evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akari-partner-offer-exchange
          path: outreach/
          retention-days: 30
